<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>猜猜我是谁</title>
      <link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;700&display=swap">
    <style>
      body {
        background:linear-gradient(135deg,#f0f9ff,#f3e5ff,#ffe0e9);
        min-height:100vh;background-attachment:fixed;
        font-family:"Microsoft YaHei",sans-serif;
        padding:30px;
        margin: 0;
      }
      .card {
        background:linear-gradient(135deg,#FCFCFC,#FFB5B5);
        min-height:200px;
        padding:25px;
        margin:20px auto;
        border-radius:15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        font-family: "Noto Sans SC",cursive;
        text-align:center}
      .card:hover {
        transform: translateY(-5px);transition:0.3s}
      img {
        width:300px;
        height:auto;
        display:block;
        margin:0 auto 18px;
        border-radius:12px;}
      .main-title {font-size:32px;color:#333;text-align:center;margin-bottom:30px;}
      h2{font-family:"Noto Sans SC",cursive;text-align: center;}
    </style>
  </head>
  <body>
      <h1 class="main-title">猜猜我是谁</h1>
	  <div
           style="
	        text-align:center;
	        padding:40px;">
          <img src="Tibbie.jpg.jpg" width="100px" height="100px">
      </div>
      <h2></h2>
      <div class="card"
           style="max-width:700px;margin:30px auto;padding:15px;line-height:1.5;">
          <p>我无限地热爱着新的一日</p>
          <p>今天的太阳 今天的马 今天的花楸树</p>
          <p>使我健康 富足 拥有一生</p>
          <p>从黎明到黄昏 阳光充足</p>
          <p>胜过一切过去的诗</p>
          <p>/海子《幸福的一日》</p>
      </div>
      <div style="
	  text-align:center;
	  padding:20px;
	  font-size:20px;">
          <p>添的网站</p>
      </div>>
  </body>
</html>
